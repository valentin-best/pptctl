name: renderer-compat

# Optimizes and merges the decks in tests/corpus/manifest.json and checks that
# headless LibreOffice converts every output, page for page, and that lint
# finds no new integrity problems (scripts/renderer_compat.py). Installing
# LibreOffice is slow, so this runs weekly, by hand, and on pull requests that
# touch optimize or merge rather than on every change.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/optimize*'
      - 'src/lib/merge*'
      - 'tests/corpus/**'
      - 'scripts/renderer_compat.py'
      - '.github/workflows/renderer-compat.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libreoffice:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools, LibreOffice and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build \
            libreoffice-impress poppler-utils

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: renderer-compat
          max-size: 500M

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            build/linux-release/_deps/*-src
            build/linux-release/_deps/*-subbuild
            build/linux-release/_deps/libjpeg_turbo-install
            build/linux-release/_deps/libjpeg_turbo-ext-build/pptctl-*.txt
          key: deps-renderer-compat-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: deps-renderer-compat-

      - name: Build pptctl
        run: |
          cmake --preset linux-release -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
          cmake --build --preset linux-release --target pptctl --parallel

      # The decks don't change (each is pinned by sha256), so download them once.
      - name: Cache the corpus
        uses: actions/cache@v6
        with:
          path: tests/corpus/decks
          key: corpus-${{ hashFiles('tests/corpus/manifest.json') }}

      - name: Fetch the corpus
        run: python3 scripts/renderer_compat.py fetch

      - name: Optimize, merge and convert
        run: >
          python3 scripts/renderer_compat.py run build/linux-release
          --out renderer-compat --doc renderer-compat/renderer-compat.md

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-compat
          path: renderer-compat/
          if-no-files-found: ignore
