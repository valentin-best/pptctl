name: ci

# Docs-only changes don't build anything.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']

# Cancel in-progress runs on the same branch when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc13
            os: ubuntu-24.04
            preset: linux-release
            cc: gcc-13
            cxx: g++-13
            apt: gcc-13 g++-13
          - name: linux-clang18
            os: ubuntu-24.04
            preset: linux-release
            cc: clang-18
            cxx: clang++-18
            apt: clang-18
          - name: macos-arm64
            os: macos-15
            preset: macos-release
            cc: clang
            cxx: clang++
          - name: windows-msvc
            os: windows-2022
            preset: windows-release
            cc: cl
            cxx: cl

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # Read by CMake on first configure; the libjpeg-turbo sub-build inherits them.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ${{ matrix.apt }}

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja || true

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Compiled objects. Most of the build is our own code, and a PR touches
      # a few files, so most translation units come out of this cache.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}
          max-size: 500M

      # FetchContent sources plus the libjpeg-turbo install and its stamp, so
      # configure neither re-downloads nor rebuilds libjpeg-turbo. The key
      # changes with any CMake change; restore-keys falls back to the newest
      # older entry, and FetchContent/the stamp redo only what actually changed.
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/${{ matrix.preset }}/_deps/*-src
            build/${{ matrix.preset }}/_deps/*-subbuild
            build/${{ matrix.preset }}/_deps/libjpeg_turbo-install
            build/${{ matrix.preset }}/_deps/libjpeg_turbo-ext-build/pptctl-*.txt
          key: deps-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: deps-${{ matrix.name }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

      - name: Smoke test the binary (Unix)
        if: runner.os != 'Windows'
        run: |
          ./build/${{ matrix.preset }}/pptctl --version
          ./build/${{ matrix.preset }}/pptctl info tests/fixtures/three_slides.pptx

      - name: Smoke test the binary (Windows)
        if: runner.os == 'Windows'
        run: |
          .\build\${{ matrix.preset }}\pptctl.exe --version
          .\build\${{ matrix.preset }}\pptctl.exe info tests\fixtures\three_slides.pptx

      # Commits clean and failing decks through both hooks in .pre-commit-hooks.yaml.
      # The fetch hook downloads the release named in CMakeLists.txt.
      - name: pre-commit hooks
        if: matrix.name != 'linux-clang18'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRE_COMMIT: pipx run pre-commit==4.7.0
        run: scripts/test-pre-commit.sh build/${{ matrix.preset }}

      # The git recipes in docs/git-integration.md: driver, textconv, difftool.
      - name: git integration
        if: matrix.name != 'linux-clang18'
        shell: bash
        run: scripts/test-git-integration.sh build/${{ matrix.preset }}

  lint:
    name: lint (clang-tidy)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          # A pull_request checkout is a merge commit; its first parent is the
          # base branch, so HEAD^1..HEAD is exactly what the PR changes.
          fetch-depth: 2

      # On a PR, tidy the source files it changed plus those including a header
      # it changed (scripts/tidy_files.py), or everything when it changes the
      # tidy config, presets, cmake/, this workflow, that script or
      # CMakeLists.txt beyond its source lists. Pushes to main always tidy everything. The pre-commit hook
      # already tidies changed files locally.
      - name: Select files
        id: select
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            files=$(find src -name '*.cpp' | sort)
            echo "Push to $REF: tidying every file."
          else
            files=$(python3 scripts/tidy_files.py HEAD^1 HEAD)
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$files" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        if: steps.select.outputs.files != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-18 clang-tidy-18 clang-tools-18

      - name: Cache dependencies
        if: steps.select.outputs.files != ''
        uses: actions/cache@v4
        with:
          path: |
            build/linux-release/_deps/*-src
            build/linux-release/_deps/*-subbuild
            build/linux-release/_deps/libjpeg_turbo-install
            build/linux-release/_deps/libjpeg_turbo-ext-build/pptctl-*.txt
          key: deps-lint-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: deps-lint-

      - name: Configure (generate compile_commands.json)
        if: steps.select.outputs.files != ''
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake --preset linux-release -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Run clang-tidy
        if: steps.select.outputs.files != ''
        env:
          FILES: ${{ steps.select.outputs.files }}
        # $FILES unquoted on purpose (one argument per line); no globbing.
        run: |
          set -f
          run-clang-tidy-18 -p build/linux-release $FILES
